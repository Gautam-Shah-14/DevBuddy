name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build, test, smoke-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Cross-platform smoke test (run_shell, search_files)
        run: node .github/scripts/smoke-test.mjs
